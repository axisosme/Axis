    RouterTaskRuntimeEvent:
      description: Published Runtime v1 Router-to-Relay task projection; no Attempt, binding, instruction, or native identifier is present.
      type: object
      required: [contractVersion, messageId, correlationId, operationId, causationMessageId, occurredAt, producer, consumer, envelopeType, task, run]
      properties:
        contractVersion: { $ref: '#/components/schemas/ContractVersion' }
        messageId: { $ref: '#/components/schemas/ProviderNeutralId' }
        correlationId: { $ref: '#/components/schemas/ProviderNeutralId' }
        operationId: { $ref: '#/components/schemas/ProviderNeutralId' }
        causationMessageId: { $ref: '#/components/schemas/ProviderNeutralId' }
        occurredAt: { type: string, format: date-time }
        producer: { const: router }
        consumer: { const: relay }
        envelopeType: { enum: [task.accepted, task.progressed, task.succeeded, task.failed] }
        task: { $ref: '#/components/schemas/Task' }
        run: { $ref: '#/components/schemas/RunProjection' }
        progress: { $ref: '#/components/schemas/Progress' }
        resultRef: { $ref: '#/components/schemas/ResultRef' }
        error: { $ref: '#/components/schemas/RuntimeError' }
      additionalProperties: false
    RouterTaskWaitingRunProjection:
      type: object
      required: [runId, state]
