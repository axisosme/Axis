        runId: { $ref: '#/components/schemas/ProviderNeutralId' }
        state: { const: waiting_for_input }
      additionalProperties: false
    RouterTaskWaitingForInputEnvelope:
      description: Closed Router 1.0.0 waiting projection; the current Run is terminal while the AgentSession remains open.
      type: object
      required: [contractVersion, messageId, correlationId, operationId, causationMessageId, occurredAt, producer, consumer, envelopeType, task, run, attemptId, elicitation]
      properties:
        contractVersion: { const: 1.0.0 }
        messageId: { $ref: '#/components/schemas/ProviderNeutralId' }
        correlationId: { $ref: '#/components/schemas/ProviderNeutralId' }
        operationId: { $ref: '#/components/schemas/ProviderNeutralId' }
        causationMessageId: { $ref: '#/components/schemas/ProviderNeutralId' }
        occurredAt: { type: string, format: date-time }
        producer: { const: router }
        consumer: { const: relay }
        envelopeType: { const: task.waiting_for_input }
        task: { $ref: '#/components/schemas/Task' }
        run: { $ref: '#/components/schemas/RouterTaskWaitingRunProjection' }
        attemptId: { $ref: '#/components/schemas/ProviderNeutralId' }
        elicitation: { $ref: '#/components/schemas/StructuredElicitation' }
      additionalProperties: false
    RouterTaskEvent:
      oneOf:
        - $ref: '#/components/schemas/RouterTaskRuntimeEvent'
        - $ref: '#/components/schemas/RouterTaskWaitingForInputEnvelope'
    VersionedReference:
      type: object
      required: [ref, version]
      properties:
        ref: { $ref: '#/components/schemas/ProviderNeutralId' }
        version: { $ref: '#/components/schemas/ProviderNeutralId' }
      additionalProperties: false
    RouterRunLifecycleEvent:
      description: >-
        One Worker run lifecycle event as validateRouterWorkerLifecycleEvent accepts it (RouterRunLifecycleEnvelope):
        run.accepted, run.progressed, run.succeeded, run.failed, the run_agent_response delivery, or the bare Linear
        run.waiting_for_input extension. Runtime identities use contractVersion 1.0.0; the Linear waiting extension
        keeps contractVersion 1.0.0 and carries the validated elicitation directly.
      anyOf:
        - $ref: '#/components/schemas/RunAcceptedEnvelope'
        - $ref: '#/components/schemas/RunProgressedEnvelope'
        - $ref: '#/components/schemas/RunSucceededEnvelope'
        - $ref: '#/components/schemas/RunFailedEnvelope'
        - $ref: '#/components/schemas/RunAgentResponseDelivery'
        - $ref: '#/components/schemas/RunWaitingForInputEnvelope'
    RouterNodeEventHttpRequest:
      type: object
      required: [contractVersion, nodeRef, origin, envelope, recordedAt]
      properties:
        contractVersion: { const: 1.0.0 }
        nodeRef: { $ref: '#/components/schemas/VersionedReference' }
        origin: { $ref: '#/components/schemas/WorkerExecutionIdentity' }
        envelope: { $ref: '#/components/schemas/RouterRunLifecycleEvent' }
        recordedAt: { type: string, description: When the Node journaled the event. }
      additionalProperties: false
    RouterNodeEventHttpResponse:
      type: object
      required: [contractVersion, nodeRef, sourceMessageId, runId, status, replayed]
      properties:
        contractVersion: { const: 1.0.0 }
        nodeRef: { $ref: '#/components/schemas/VersionedReference' }
        sourceMessageId: { type: string }
        runId: { $ref: '#/components/schemas/ProviderNeutralId' }
        status: { type: string, enum: [buffered, projected] }
        replayed: { type: boolean }
      additionalProperties: false
    NodeWorkerEventRequest:
      type: object
      required: [envelope, recordedAt]
      properties:
        envelope: { $ref: '#/components/schemas/RouterRunLifecycleEvent' }
        recordedAt: { type: string, format: date-time, description: Canonical toISOString() form. }
      additionalProperties: false
    NodeWorkerEventReceipt:
      type: object
      required: [eventId, replayed, recordedAt]
      properties:
        eventId: { type: string }
        replayed: { type: boolean }
        recordedAt: { type: string }
      additionalProperties: false
    NodeMaintenanceRequest:
      type: object
      required: [contractVersion, mode]
      properties:
        contractVersion: { const: 1.0.0 }
        mode: { type: string, enum: [drain, resume] }
      additionalProperties: false
    NodeMaintenanceStatus:
      type: object
      description: Closed five-key status. idle is true exactly when every blocker count is zero.
      required: [contractVersion, nodeRef, mode, idle, blockerCounts]
      properties:
        contractVersion: { const: 1.0.0 }
        nodeRef: { $ref: '#/components/schemas/VersionedReference' }
        mode: { type: string, enum: [drain, resume] }
        idle: { type: boolean }
        blockerCounts:
          type: object
          required: [reservedCommands, dispatchingCommands, ambiguousCommands, pendingNodeEvents, quarantinedNodeEvents, activeWorkerRuns, pendingWorkerOutbox, unknownWorkerEvidence]
          properties:
            reservedCommands: { type: integer, minimum: 0 }
            dispatchingCommands: { type: integer, minimum: 0 }
            ambiguousCommands: { type: integer, minimum: 0 }
            pendingNodeEvents: { type: integer, minimum: 0 }
            quarantinedNodeEvents: { type: integer, minimum: 0 }
            activeWorkerRuns: { type: integer, minimum: 0 }
            pendingWorkerOutbox: { type: integer, minimum: 0 }
            unknownWorkerEvidence: { type: integer, minimum: 0 }
          additionalProperties: false
      additionalProperties: false
    NodeReadiness:
      type: object
      description: Aggregate evidence, intentionally not an overall Node ready/not-ready verdict.
      required: [contractVersion, nodeRef, observedAt, service, storage, workers]
      properties:
        contractVersion: { const: 1.0.0 }
        nodeRef: { $ref: '#/components/schemas/VersionedReference' }
        observedAt: { type: string }
        service:
          type: object
          required: [status]
          properties: { status: { const: configured } }
          additionalProperties: false
        storage:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [available, unavailable] }
            safeCode: { const: axis.node.storage_unavailable }
          additionalProperties: false
        workers:
          type: array
          items:
            type: object
            required: [workerId, transport, readinessSupport]
            properties:
              workerId: { $ref: '#/components/schemas/ProviderNeutralId' }
              transport: { type: string, enum: [reachable, degraded, unknown] }
              readinessSupport: { type: string, enum: [supported, unsupported] }
              readiness: { $ref: '#/components/schemas/CodexWorkerReadiness' }
            additionalProperties: false
      additionalProperties: false
    WorkerSelection:
      type: object
      description: >-
        What a command says about which local Worker should run it. It carries routing FACTS and no
        decision: the source's scope and its fixed claude/codex executor labels. The Node
        alone turns that into a Worker, applying executor label, then Team rule, then its
        default. The shape is closed; a payload using `key` or `default` variants is refused as malformed rather
        than reinterpreted. The discriminator is exactly kind=policy; Worker selection is
        derived only from the declared scope and executor labels.
      required: [kind, scope, executorLabels]
      properties:
        kind: { const: policy }
        scope: { $ref: '#/components/schemas/WorkerSelectionScope' }
        executorLabels:
          type: array
          description: >-
            The executor labels present on the source, deduplicated and in the fixed order
            claude, codex. Canonical order is part of the contract rather than a
            convenience: the selection is digested into bindingDigest, so the same routing
            facts must serialise identically whatever order the provider listed them in. Two or
            more entries is a refusal (axis.node.selection_conflict), not a precedence question.
            These are executor names, not the source's label text: the Relay maps a bare
            claude/codex label, or a WORKER group label such as WORKER:CODEX
            (case-insensitive), onto the matching name, and both spellings of one
            executor yield one entry.
          items: { type: string, enum: [claude, codex] }
          uniqueItems: true
          maxItems: 4
      additionalProperties: false
    WorkerSelectionScope:
      type: object
      description: >-
        The Linear source a Node matches its Team rules against. The same
        {system, tenantId, scopeId} triple is frozen into the Router target snapshot:
        the tenant is the organization and the scope is the Team.
      required: [system, tenantId, scopeId]
      properties:
        system: { type: string, enum: [linear] }
        tenantId: { $ref: '#/components/schemas/ProviderNeutralId' }
        scopeId: { $ref: '#/components/schemas/ProviderNeutralId' }
      additionalProperties: false
    NodeTarget:
      type: object
      required: [endpointRef, identity, sessionBindingExecutorId]
      properties:
        endpointRef: { $ref: '#/components/schemas/VersionedReference' }
        identity: { $ref: '#/components/schemas/WorkerExecutionIdentity' }
        sessionBindingExecutorId: { $ref: '#/components/schemas/ProviderNeutralId' }
      additionalProperties: false
    NodeReservationEvidence:
      type: object
      description: Immutable routing reservation. It is not evidence that a Worker executed.
      required: [workerKey, target]
      properties:
        workerKey: { $ref: '#/components/schemas/ProviderNeutralId' }
        target: { $ref: '#/components/schemas/NodeTarget' }
      additionalProperties: false
    NodeSessionBinding:
      type: object
      description: Runtime session binding without nativeSessionRef. contractVersion is any accepted Runtime boundary version.
      required: [contractVersion, sessionBindingId, taskId, attemptId, runId, correlationId, workerId, executorId]
      properties:
        contractVersion: { type: string }
        sessionBindingId: { $ref: '#/components/schemas/ProviderNeutralId' }
        taskId: { $ref: '#/components/schemas/ProviderNeutralId' }
        attemptId: { $ref: '#/components/schemas/ProviderNeutralId' }
        runId: { $ref: '#/components/schemas/ProviderNeutralId' }
        correlationId: { $ref: '#/components/schemas/ProviderNeutralId' }
        workerId: { $ref: '#/components/schemas/ProviderNeutralId' }
        executorId: { $ref: '#/components/schemas/ProviderNeutralId' }
      additionalProperties: false
    NodeKnownWorkerFailure:
      type: object
      description: A known Worker failure code with its fixed safe message and certainty.
      required: [code, safeMessage, certainty]
      properties:
        code: { type: string }
        safeMessage: { type: string }
        certainty: { type: string, enum: [definite, ambiguous] }
      additionalProperties: false
    NodePendingRunStartEnvelope:
      type: object
      description: >-
        A Runtime run.start envelope (see WorkerRunStartEnvelope) whose identity.sessionBinding carries exactly
        contractVersion, sessionBindingId, taskId, attemptId, runId and correlationId -- no workerId or executorId.
        The Node completes both from its reservation. Validated by the pinned Runtime boundary validator.
      additionalProperties: true
    NodeCommandStart:
      type: object
      required: [contractVersion, commandId, command, start, instruction, workspacePolicyRef]
      properties:
        contractVersion: { const: 1.0.0 }
        commandId: { $ref: '#/components/schemas/ProviderNeutralId' }
        command: { const: start }
        start: { $ref: '#/components/schemas/NodePendingRunStartEnvelope' }
        instruction: { type: string, minLength: 1, writeOnly: true }
        workspacePolicyRef:
          oneOf:
            - $ref: '#/components/schemas/VersionedReference'
            - type: 'null'
      additionalProperties: false
    NodeCommandContinue:
      type: object
      required: [contractVersion, commandId, command, start, instruction, continuation, workspacePolicyRef]
      properties:
        contractVersion: { const: 1.0.0 }
        commandId: { $ref: '#/components/schemas/ProviderNeutralId' }
        command: { const: continue }
        start: { $ref: '#/components/schemas/NodePendingRunStartEnvelope' }
        instruction: { type: string, minLength: 1, writeOnly: true }
        continuation:
          type: object
          required: [priorRunId]
          properties: { priorRunId: { $ref: '#/components/schemas/ProviderNeutralId' } }
          additionalProperties: false
        workspacePolicyRef:
          oneOf:
            - $ref: '#/components/schemas/VersionedReference'
            - type: 'null'
      additionalProperties: false
    NodeCommandCancel:
      type: object
      required: [contractVersion, commandId, command, target]
      properties:
        contractVersion: { const: 1.0.0 }
        commandId: { $ref: '#/components/schemas/ProviderNeutralId' }
        command: { const: cancel }
        target:
          type: object
          required: [runId]
          properties: { runId: { $ref: '#/components/schemas/ProviderNeutralId' } }
          additionalProperties: false
      additionalProperties: false
    NodeCommandSteer:
      type: object
      description: >-
        Forwards a soft steer to the Worker running target.runId, which must be the predecessor route's Run.
        The Node sends the Worker command 1.0.0 steer without executionTarget; its accepted receipt's result is
        `steered` or `interrupt_requested`. A draining Node forwards it, as it does a cancel; a fresh start
        or continue is refused with the definite axis.node.draining before anything is recorded, and a
        replayed command still reserved or dispatching with axis.node.recovery_required. An exact axis.worker.malformed response is recorded as a definite `rejected`
        receipt. The Node command contract version is 1.0.0.
      required: [contractVersion, commandId, command, target, instruction]
      properties:
        contractVersion: { const: 1.0.0 }
        commandId: { $ref: '#/components/schemas/ProviderNeutralId' }
        command: { const: steer }
        target:
          type: object
          required: [runId]
          properties: { runId: { $ref: '#/components/schemas/ProviderNeutralId' } }
          additionalProperties: false
        instruction: { type: string, minLength: 1, writeOnly: true }
      additionalProperties: false
    NodeCommandRequest:
      type: object
      required: [contractVersion, nodeRef, target, command]
      properties:
        contractVersion: { const: 1.0.0 }
        nodeRef: { $ref: '#/components/schemas/VersionedReference' }
        target:
          type: object
          required: [selection]
          properties: { selection: { $ref: '#/components/schemas/WorkerSelection' } }
          additionalProperties: false
        command:
          oneOf:
            - $ref: '#/components/schemas/NodeCommandStart'
            - $ref: '#/components/schemas/NodeCommandContinue'
            - $ref: '#/components/schemas/NodeCommandCancel'
            - $ref: '#/components/schemas/NodeCommandSteer'
      additionalProperties: false
    NodeReceiptQuery:
      type: object
      required: [contractVersion, nodeRef, commandId]
      properties:
        contractVersion: { const: 1.0.0 }
        nodeRef: { $ref: '#/components/schemas/VersionedReference' }
        commandId: { $ref: '#/components/schemas/ProviderNeutralId' }
      additionalProperties: false
    NodeReceipt:
      oneOf:
        - type: object
          required: [contractVersion, nodeRef, commandId, status, evidence, result]
          properties:
            contractVersion: { const: 1.0.0 }
            nodeRef: { $ref: '#/components/schemas/VersionedReference' }
            commandId: { $ref: '#/components/schemas/ProviderNeutralId' }
            status: { const: accepted }
            evidence:
              type: object
              required: [workerKey, target, sessionBinding]
              properties:
                workerKey: { $ref: '#/components/schemas/ProviderNeutralId' }
                target: { $ref: '#/components/schemas/NodeTarget' }
                sessionBinding: { $ref: '#/components/schemas/NodeSessionBinding' }
              additionalProperties: false
            result: { $ref: '#/components/schemas/WorkerCommandResponse' }
          additionalProperties: false
        - type: object
          required: [contractVersion, nodeRef, commandId, status, reservation, failure]
          properties:
            contractVersion: { const: 1.0.0 }
            nodeRef: { $ref: '#/components/schemas/VersionedReference' }
            commandId: { $ref: '#/components/schemas/ProviderNeutralId' }
            status: { const: rejected }
            reservation: { $ref: '#/components/schemas/NodeReservationEvidence' }
            failure: { $ref: '#/components/schemas/NodeKnownWorkerFailure' }
          additionalProperties: false
        - type: object
          required: [contractVersion, nodeRef, commandId, status, reservation]
          properties:
            contractVersion: { const: 1.0.0 }
            nodeRef: { $ref: '#/components/schemas/VersionedReference' }
            commandId: { $ref: '#/components/schemas/ProviderNeutralId' }
            status: { type: string, enum: [reserved, dispatching, ambiguous] }
            reservation: { $ref: '#/components/schemas/NodeReservationEvidence' }
          additionalProperties: false
        - type: object
          required: [contractVersion, nodeRef, commandId, status]
          properties:
            contractVersion: { const: 1.0.0 }
            nodeRef: { $ref: '#/components/schemas/VersionedReference' }
            commandId: { $ref: '#/components/schemas/ProviderNeutralId' }
            status: { const: not_found }
          additionalProperties: false
    Accepted:
      type: object
      required: [accepted, duplicate]
      properties:
        accepted: { type: boolean, const: true }
        duplicate: { type: boolean }
      additionalProperties: false
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [live, ready, not_ready] }
      additionalProperties: false
    Diagnostics:
      type: object
      required: [status, vault, stores]
      properties:
        status: { type: string, enum: [healthy, degraded] }
        vault: { type: boolean, description: Whether the credential vault is readable. }
        stores:
          type: object
          description: One verdict per store the channel opened, keyed by the composition's own store name.
          additionalProperties: { type: boolean }
      additionalProperties: false
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
          additionalProperties: false
      additionalProperties: false
    RouterHttpErrorCode:
      type: string
      description: Closed Router listener error codes (HttpErrorCode and messages in src/router/http.ts).
      enum:
        - axis.router.malformed
        - axis.router.unauthorized
        - axis.router.body_too_large
        - axis.router.unsupported_media
        - axis.router.intent_conflict
        - axis.router.conflict
        - axis.router.protocol_violation
        - axis.router.recovery_required
        - axis.router.worker_rejected
    RouterError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/RouterHttpErrorCode' }
            message: { type: string }
          additionalProperties: false
      additionalProperties: false
    NodeErrorCode:
      type: string
      description: >-
        Closed Node error codes (errors and NODE_ERROR_STATUS in src/shared/router-node.ts) with their defined HTTP
        status: axis.node.malformed=400, axis.node.unauthorized=401, axis.node.target_forbidden=403,
        axis.node.target_unknown=404, axis.node.worker_unavailable=409, axis.node.selection_conflict=409, axis.node.intent_conflict=409,
        axis.node.binding_conflict=409, axis.node.body_too_large=413, axis.node.unsupported_media=415,
        axis.node.recovery_required=503, axis.node.draining=503, axis.node.dispatch_ambiguous=503,
        axis.node.storage_unavailable=503. axis.node.draining is the one definite 5xx code. A wrong
        method is axis.node.malformed at 405. Each safeMessage is fixed per code.
      enum:
        - axis.node.malformed
        - axis.node.unauthorized
        - axis.node.target_forbidden
        - axis.node.target_unknown
        - axis.node.worker_unavailable
        - axis.node.selection_conflict
        - axis.node.intent_conflict
        - axis.node.binding_conflict
        - axis.node.body_too_large
        - axis.node.unsupported_media
        - axis.node.recovery_required
        - axis.node.draining
        - axis.node.dispatch_ambiguous
        - axis.node.storage_unavailable
    NodeCommandError:
      type: object
      description: Node command listener error body.
      required: [contractVersion, error]
      properties:
        contractVersion: { const: 1.0.0 }
        error:
          type: object
          required: [code, safeMessage]
          properties:
            code: { $ref: '#/components/schemas/NodeErrorCode' }
            safeMessage: { type: string }
          additionalProperties: false
      additionalProperties: false
    NodeErrorV1:
      type: object
      description: Node event listener error body (maintenance and Worker event ingress).
      required: [contractVersion, error]
      properties:
        contractVersion: { const: 1.0.0 }
        error:
          type: object
          required: [code, safeMessage]
          properties:
            code: { $ref: '#/components/schemas/NodeErrorCode' }
            safeMessage: { type: string }
          additionalProperties: false
      additionalProperties: false
    WorkerHttpErrorCode:
      type: string
      description: Closed Worker listener error codes (WorkerHttpErrorCode and safeMessages in src/worker/http.ts).
      enum:
        - axis.worker.malformed
        - axis.worker.unauthorized
        - axis.worker.policy_forbidden
        - axis.worker.identity_mismatch
        - axis.worker.method_not_allowed
        - axis.worker.body_too_large
        - axis.worker.unsupported_media
        - axis.worker.adapter_invalid
        - axis.worker.launch_failed
        - axis.worker.launch_ambiguous
        - axis.worker.intent_conflict
        - axis.worker.recovery_required
        - axis.worker.operation_unsupported
        - axis.worker.runtime_missing
        - axis.worker.runtime_incompatible
        - axis.worker.authentication_required
        - axis.worker.probe_timeout
        - axis.worker.capability_unavailable
        - axis.worker.workspace_unavailable
        - axis.worker.continuation_unresumable
    WorkerError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/WorkerHttpErrorCode' }
            message: { type: string }
          additionalProperties: false
      additionalProperties: false
  responses:
    NodeCommandError:
      description: >-
        Node command listener refusal. 400 axis.node.malformed; 401 axis.node.unauthorized; 404
        axis.node.target_unknown (unknown path); 409 axis.node.worker_unavailable, axis.node.intent_conflict or
        axis.node.binding_conflict; 413 axis.node.body_too_large; 415 axis.node.unsupported_media; 503
        axis.node.recovery_required, axis.node.draining (a fresh start or continue while draining),
        axis.node.dispatch_ambiguous or axis.node.storage_unavailable (also any
        unclassified failure and every request during shutdown). axis.node.target_forbidden is not raised here.
      content: { application/json: { schema: { $ref: '#/components/schemas/NodeCommandError' } } }
    NodeEventListenerError:
      description: >-
        Node event listener refusal. 400 axis.node.malformed; 401 axis.node.unauthorized; 403
        axis.node.target_forbidden; 404 axis.node.target_unknown (unknown path, or a Run with no accepted route); 413
        axis.node.body_too_large; 415 axis.node.unsupported_media; 503 axis.node.storage_unavailable (also any
        unclassified failure and every request during shutdown).
      content: { application/json: { schema: { $ref: '#/components/schemas/NodeErrorV1' } } }
    LinearApiResult:
      description: >-
        Upstream GraphQL envelope/status, or a local GraphQL error with a safe
        code, requestId and outcome in extensions. 400 may be Linear RATELIMITED;
        200 may contain errors or a mutation success:false. Mutation transport,
        deadline, redirect, malformed/oversized responses and upstream 5xx produce
        502 linear.proxy.outcome_unknown. Valid 5xx data/errors remain alongside
        the uncertainty error. Reconcile before retry. 503 also covers unwired
        authority, pre-dispatch OAuth/audit failures and local capacity. See
        docs/LINEAR-API-PROXY.md for the full error-code and quota-header table.
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        X-Axis-Request-Id: { schema: { type: string, format: uuid } }
        X-Axis-Linear-Outcome:
          schema: { type: string, enum: [not_dispatched, response_received, graphql_errors, partial, upstream_error, outcome_unknown] }
        X-Axis-Linear-Audit: { schema: { type: string, enum: [recorded, unavailable] } }
        Retry-After: { schema: { type: string } }
        X-RateLimit-Requests-Limit: { schema: { type: string } }
        X-RateLimit-Requests-Remaining: { schema: { type: string } }
        X-RateLimit-Requests-Reset: { schema: { type: string } }
        X-RateLimit-Endpoint-Requests-Limit: { schema: { type: string } }
        X-RateLimit-Endpoint-Requests-Remaining: { schema: { type: string } }
        X-RateLimit-Endpoint-Requests-Reset: { schema: { type: string } }
        X-RateLimit-Endpoint-Name: { schema: { type: string } }
        X-Complexity: { schema: { type: string } }
        X-RateLimit-Complexity-Limit: { schema: { type: string } }
        X-RateLimit-Complexity-Remaining: { schema: { type: string } }
        X-RateLimit-Complexity-Reset: { schema: { type: string } }
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            anyOf:
              - required: [data]
              - required: [errors]
            properties:
              data: { type: [object, 'null'], additionalProperties: true }
              errors:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [message]
                  additionalProperties: true
                  properties:
                    message: { type: string }
                    extensions: { type: object, additionalProperties: true }
    BadRequest:
      description: Malformed owned input.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Authentication, timestamp, state, or authority rejected.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: The configured principal, installation, Team, or target is not allowed.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: A durable transport or source-event identity conflicts with prior authenticated content.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooLarge:
      description: Request exceeds the route-specific raw-body bound.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UnsupportedMedia:
      description: Media type or content encoding is unsupported.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    WorkerUnauthorized:
      description: Worker bearer authorization is missing, malformed, duplicated, or incorrect.
      content: { application/json: { schema: { $ref: '#/components/schemas/WorkerError' } } }
    WorkerPolicyForbidden:
      description: Worker/Executor identity or configured organization workspace policy is not allowed.
      content: { application/json: { schema: { $ref: '#/components/schemas/WorkerError' } } }
    WorkerBodyTooLarge:
      description: Worker request exceeds 65,536 raw bytes.
      content: { application/json: { schema: { $ref: '#/components/schemas/WorkerError' } } }
    WorkerUnsupportedMedia:
      description: Worker request media type or encoding is unsupported.
      content: { application/json: { schema: { $ref: '#/components/schemas/WorkerError' } } }
    WorkerMalformed:
      description: Strict command framing (an exact 1.0.0 contractVersion and a well-formed executionTarget consistent with the session binding), workspace reference validation, closed-body parsing, or Runtime v1 start envelope validation failed.
      content: { application/json: { schema: { $ref: '#/components/schemas/WorkerError' } } }
    WorkerConflict:
      description: >-
        Command idempotency, immutable run intent, or active-run state conflicts with durable Worker state; or
        (axis.worker.identity_mismatch) the command's executionTarget is not this Worker's configured
        identity, refused before any Run is reserved or launched.
      content: { application/json: { schema: { $ref: '#/components/schemas/WorkerError' } } }
    WorkerLaunchFailed:
      description: A well-formed executor start was deterministically rejected. The reservation is observational and is not retried.
      content: { application/json: { schema: { $ref: '#/components/schemas/WorkerError' } } }
    WorkerUnavailable:
      description: No trusted mapped/default/fallback directory is usable, old active durable state requires recovery, workspace audit persistence failed, or the executor lifecycle cannot be safely recovered. Workspace failures use fixed code axis.worker.workspace_unavailable and expose no path or filesystem diagnostic.
      content: { application/json: { schema: { $ref: '#/components/schemas/WorkerError' } } }
    Unavailable:
      description: Durable acceptance or readiness unavailable.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
